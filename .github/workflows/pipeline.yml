```yaml
name: Pipeline CI - Calculadora com Matrix

on:
  push:
    branches: [main]

jobs:

  # =========================
  # BUILD
  # =========================

  build:
    name: Build - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04

        python-version:
          - "3.11"
          - "3.12"

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # PYTHON + CACHE
      # =========================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # =========================
      # VERSÕES
      # =========================

      - name: Mostrar ambiente
        run: |
          echo "Sistema operacional:"
          lsb_release -a

          echo "Versão do Python:"
          python --version

          echo "Versão do pip:"
          pip --version

      # =========================
      # DEPENDÊNCIAS
      # =========================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 bandit

      # =========================
      # GERAR ARTEFATO
      # =========================

      - name: Criar artefato
        run: |
          zip pipeline-demo.zip calculadora.py test_*.py requirements.txt

      # =========================
      # PUBLICAR ARTEFATO
      # =========================

      - name: Publicar artefato
        uses: actions/upload-artifact@v4
        with:
          name: codigo-buildado-${{ matrix.os }}-python-${{ matrix.python-version }}
          path: pipeline-demo.zip


  # =========================
  # TESTES
  # =========================

  test:
    name: Testes - ${{ matrix.os }} - Python ${{ matrix.python-version }}

    needs: build

    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-26.04

        python-version:
          - "3.11"
          - "3.12"

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # PYTHON
      # =========================

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # =========================
      # DEPENDÊNCIAS
      # =========================

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov flake8 bandit

      # =========================
      # LINTER
      # =========================

      - name: Análise de código - Flake8
        run: |
          flake8 calculadora.py test_*.py

      # =========================
      # TESTES UNITÁRIOS
      # =========================

      - name: Testes unitários
        run: |
          pytest test_*.py

      # =========================
      # COBERTURA
      # =========================

      - name: Cobertura de código
        run: |
          pytest --cov=calculadora \
            --cov-report=term-missing \
            --cov-fail-under=80

      # =========================
      # SEGURANÇA - BANDIT
      # =========================

      - name: Análise de segurança - Bandit
        run: |
          bandit -r calculadora.py

      # =========================
      # VERIFICAÇÃO DE CHAVES
      # =========================

      - name: Verificar chaves de API expostas
        run: |
          if grep -R -nE "API_KEY[[:space:]]*=[[:space:]]*['\"][^'\"]+['\"]" . \
            --exclude-dir=.git \
            --exclude=pipeline.yml; then

            echo "ERRO: Chave de API encontrada!"
            exit 1

          else

            echo "Nenhuma chave de API encontrada."

          fi


  # =========================
  # SONARQUBE
  # =========================

  sonar:
    name: SonarQube

    needs: test

    runs-on: ubuntu-24.04

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =========================
      # SONARQUBE SCAN
      # =========================

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}


  # =========================
  # DEPLOY
  # =========================

  deploy:
    name: Deploy

    runs-on: ubuntu-latest

    needs: [test, sonar]

    environment:
      name: production

    steps:

      # =========================
      # CHECKOUT
      # =========================

      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # BAIXAR ARTEFATOS
      # =========================

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          pattern: codigo-buildado-*
          path: artefatos
          merge-multiple: true

      # =========================
      # VERIFICAR ARTEFATOS
      # =========================

      - name: Verificar artefatos
        run: |
          echo "Artefatos disponíveis:"
          ls -lah artefatos

      # =========================
      # EXTRAIR ARTEFATO
      # =========================

      - name: Extrair artefato
        run: |
          mkdir -p deploy
          unzip -o artefatos/pipeline-demo.zip -d deploy

      # =========================
      # VERIFICAR ARQUIVOS
      # =========================

      - name: Verificar arquivos
        run: |
          echo "Arquivos do deploy:"
          ls -lah deploy
```
